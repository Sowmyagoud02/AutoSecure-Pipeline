services:

  postgres:
    image: postgres:16
    container_name: autosecure-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: autosecure-backend
    restart: unless-stopped

    ports:
      - "8001:8000"

    env_file:
      - .env

    depends_on:
      - postgres


  ollama:
    image: ollama/ollama:latest
    container_name: autosecure_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: